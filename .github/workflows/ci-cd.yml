name: CI/CD

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  packages: write

jobs:
  test-and-scan:
    name: Build, test and security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Static security analysis (Bandit)
        run: bandit -r app -ll

      - name: Dependency vulnerability scan (pip-audit)
        run: pip-audit -r requirements.txt

  docker:
    name: Docker image, scan and push
    needs: test-and-scan
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name and version
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "VERSION=$(cat VERSION)" >> "$GITHUB_ENV"

      - name: Build image
        run: |
          docker build -t "$IMAGE:$VERSION" -t "$IMAGE:sha-${GITHUB_SHA::7}" -t "$IMAGE:latest" .

      - name: Container image scan (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.VERSION }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"   # change to "1" to fail the pipeline on findings

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push versioned image
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: docker push --all-tags "$IMAGE"

  deploy:
    name: Deploy to Kubernetes (rolling update)
    needs: docker
    runs-on: ubuntu-latest
    # Runs only if you set repository variable ENABLE_DEPLOY=true and secret KUBE_CONFIG
    if: github.ref == 'refs/heads/main' && vars.ENABLE_DEPLOY == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config

      - name: Deploy new version
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:$(cat VERSION)"
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml -f k8s/pvc.yaml -f k8s/service.yaml
          sed "s|image: restaurant-management:.*|image: ${IMAGE}|" k8s/deployment.yaml | kubectl apply -f -
          kubectl -n restaurant rollout status deployment/restaurant-app --timeout=180s \
            || { kubectl -n restaurant rollout undo deployment/restaurant-app; exit 1; }
